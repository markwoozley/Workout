<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Iron Log"/>
<title>Iron Log</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1C1B1A;color:#F2EFE9;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%;}
#root{min-height:100vh;background:#1C1B1A;}
/* Safe area padding for iPhone notch / Dynamic Island */
.page{
  padding-top: max(44px, calc(env(safe-area-inset-top) + 16px));
  padding-bottom: max(60px, calc(env(safe-area-inset-bottom) + 40px));
  padding-left:18px;padding-right:18px;max-width:420px;margin:0 auto;
}
.surf{background:#211F1B;border:1px solid #3A362F;border-radius:8px;}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8478;display:block;margin-bottom:6px;}
.eyebrow-sm{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8A8478;}
.display{font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.mono{font-family:'Courier New',Courier,monospace;}
.muted{color:#8A8478;}.muted2{color:#6E695E;}.accent{color:#D9A441;}
.divtop{border-top:1px solid #3A362F;margin-top:16px;padding-top:16px;}
.ti{background:#1F1D1A;border:1px solid #3A362F;color:#F2EFE9;width:100%;border-radius:6px;padding:10px 12px;font-size:16px;font-family:inherit;-webkit-appearance:none;outline:none;}
.ti:focus{border-color:#D9A441;}.ti::placeholder{color:#57524A;}
.ni{background:#1F1D1A;border:1px solid #3A362F;color:#F2EFE9;width:100%;border-radius:6px;padding:10px 12px;font-size:18px;font-family:'Courier New',Courier,monospace;-webkit-appearance:none;outline:none;}
.ni:focus{border-color:#D9A441;}.ni::placeholder{color:#57524A;}.ni.carried{color:#E5493D;border-color:#6B2E28;}
.si{background:#1F1D1A;border:1px solid #3A362F;color:#F2EFE9;width:100%;border-radius:6px;padding:10px 12px;font-size:15px;font-family:inherit;-webkit-appearance:none;outline:none;}
.si:focus{border-color:#D9A441;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.btn{background:#D9A441;color:#1C1B1A;border:none;cursor:pointer;width:100%;padding:14px 0;border-radius:6px;font-size:15px;font-family:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-out{background:transparent;border:1px solid #3A362F;color:#F2EFE9;cursor:pointer;width:100%;padding:12px 0;border-radius:6px;font-size:14px;font-family:inherit;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.btn-sm{background:transparent;border:1px solid #3A362F;color:#F2EFE9;cursor:pointer;padding:8px 6px;border-radius:4px;font-size:11px;font-family:inherit;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:4px;flex:1;}
.btn-del{background:transparent;border:none;color:#6B2E28;cursor:pointer;padding:4px 8px;font-family:inherit;}
.back{background:transparent;border:none;color:#8A8478;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-family:inherit;padding:0;}
.card{background:#211F1B;border:1px solid #3A362F;cursor:pointer;text-align:left;width:100%;border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.pb-row{display:flex;gap:3px;margin-bottom:22px;}.pb-seg{height:8px;flex:1;border-radius:9999px;}
.dot{border-radius:9999px;display:inline-block;flex-shrink:0;}
.tag{border:1px solid #D9A441;color:#D9A441;font-size:12px;padding:4px 10px;border-radius:9999px;}
.chip{background:#1F1D1A;border:1px solid #3A362F;border-radius:6px;padding:6px 10px;text-align:center;}
.rng-btn{background:transparent;border:1px solid #3A362F;color:#8A8478;cursor:pointer;padding:7px 0;border-radius:4px;font-size:12px;font-family:inherit;flex:1;}
.rng-btn.on{border-color:#D9A441;color:#D9A441;background:#211F1B;}
.resume-bar{background:#211F1B;border:1px solid #3A362F;border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.day-hdr{width:100%;background:transparent;border:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:inherit;}
.act-row{padding:12px 16px;border-bottom:1px solid #2A2825;display:flex;align-items:flex-start;gap:10px;}
.rating-btn{border-radius:6px;padding:10px 4px;font-size:12px;font-family:inherit;cursor:pointer;text-align:center;border:1px solid #3A362F;background:transparent;color:#8A8478;}
.rating-btn.easy-on{background:#2A3D2E;border-color:#4A8C7C;color:#7AC4A8;font-weight:600;}
.rating-btn.good-on{background:#2D2A1A;border-color:#D9A441;color:#D9A441;font-weight:600;}
.rating-btn.hard-on{background:#3D2020;border-color:#B2593F;color:#E07050;font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';

var BUILT_IN=[
  {name:'Treadmill',           cat:'Cardio',         type:'cardio'},
  {name:'Abdominal Backward',  cat:'Core',           type:'strength'},
  {name:'Abdominal Forward',   cat:'Core',           type:'strength'},
  {name:'Rotary Torso',        cat:'Core',           type:'rotary'},
  {name:'Abduction',           cat:'Leg',            type:'strength'},
  {name:'Adduction',           cat:'Leg',            type:'strength'},
  {name:'Leg Curl',            cat:'Leg',            type:'strength'},
  {name:'Leg Extension',       cat:'Leg',            type:'strength'},
  {name:'Leg Press',           cat:'Leg',            type:'strength'},
  {name:'Back Extension',      cat:'Back',           type:'strength'},
  {name:'Lat Pull Down',       cat:'Back',           type:'strength'},
  {name:'Pullover',            cat:'Back',           type:'strength'},
  {name:'Seated Row',          cat:'Back',           type:'strength'},
  {name:'Biceps Curl',         cat:'Arm & Shoulder', type:'strength'},
  {name:'Chest Press',         cat:'Arm & Shoulder', type:'strength'},
  {name:'Deltoid',             cat:'Arm & Shoulder', type:'strength'},
  {name:'Deltoid Raise',       cat:'Arm & Shoulder', type:'strength'},
  {name:'Pectoral',            cat:'Arm & Shoulder', type:'strength'},
  {name:'Shoulder Press',      cat:'Arm & Shoulder', type:'strength'},
  {name:'Triceps Extension',   cat:'Arm & Shoulder', type:'strength'},
];

var CAT_COLOR={'Cardio':'#5B8FA8','Arm & Shoulder':'#D9A441','Back':'#4A8C7C','Leg':'#B2593F','Core':'#9B9284'};
var CATS=['Cardio','Arm & Shoulder','Back','Leg','Core'];
var TYPE_LBL={strength:'Standard (weight + reps)',cardio:'Cardio (speed/time)',rotary:'Rotary (left + right reps)'};
var RATINGS=[{key:'easy',label:'\u{1F60C} Easy',cls:'easy-on'},{key:'good',label:'\u{1F4AA} Good',cls:'good-on'},{key:'too_hard',label:'\u{1F525} Too Hard',cls:'hard-on'}];
var RATING_COLOR={easy:'#7AC4A8',good:'#D9A441',too_hard:'#E07050'};
var RATING_LABEL={easy:'\u{1F60C} Easy',good:'\u{1F4AA} Good',too_hard:'\u{1F525} Too Hard'};

var S={
  screen:'home',profile:{name:'',heightIn:'',weightLb:''},
  log:[],weightLog:[],acts:[],act:null,entry:null,
  graphRange:'month',expanded:{}
};

function blankEntry(){
  return{incline:'',speed:'',time:'',rating:null,
    incCarried:false,spdCarried:false,incTouched:false,spdTouched:false,
    sets:[0,1,2].map(function(){return{weight:'',reps:'',leftReps:'',rightReps:'',carried:false,touched:false};})};
}

function load(){
  try{var p=localStorage.getItem('il_p');if(p)S.profile=JSON.parse(p);}catch(e){}
  try{var l=localStorage.getItem('il_l');if(l)S.log=JSON.parse(l);}catch(e){}
  try{var w=localStorage.getItem('il_wl');if(w)S.weightLog=JSON.parse(w);}catch(e){}
  try{var a=localStorage.getItem('il_acts');S.acts=a?JSON.parse(a):BUILT_IN.slice();}catch(e){S.acts=BUILT_IN.slice();}
}
var _pt=null;
function saveProfile(){clearTimeout(_pt);_pt=setTimeout(function(){try{localStorage.setItem('il_p',JSON.stringify(S.profile));}catch(e){}},600);}
function saveLog(){try{localStorage.setItem('il_l',JSON.stringify(S.log));}catch(e){}}
function saveActs(){try{localStorage.setItem('il_acts',JSON.stringify(S.acts));}catch(e){}}
function logWeight(w){
  var wv=nv(w);if(!wv)return;var t=today();var idx=-1;
  for(var i=0;i<S.weightLog.length;i++){if(S.weightLog[i].date===t){idx=i;break;}}
  if(idx>=0)S.weightLog[idx].weight=wv;else S.weightLog.push({date:t,weight:wv});
  S.weightLog.sort(function(a,b){return a.date.localeCompare(b.date);});
  try{localStorage.setItem('il_wl',JSON.stringify(S.weightLog));}catch(e){}
}

function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function fmtDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function nv(v){var f=parseFloat(v);return isFinite(f)?f:0;}
function bmi(h,w){return(!h||!w)?null:703*w/(h*h);}
function bmiLbl(v){return v<18.5?'Underweight':v<25?'Normal':v<30?'Overweight':'Obese';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function buildOrder(){
  var acts=S.acts,cats=['Arm & Shoulder','Back','Leg','Core'],bc={};
  cats.forEach(function(c){bc[c]=acts.filter(function(a){return a.cat===c;}).sort(function(a,b){return a.name.localeCompare(b.name);});});
  var order=acts.filter(function(a){return a.cat==='Cardio';}).slice();
  var added=true;
  while(added){added=false;cats.forEach(function(c){if(bc[c]&&bc[c].length){order.push(bc[c].shift());added=true;}});}
  return order;
}
function doneNames(){var t=today(),d={};S.log.filter(function(e){return e.date===t;}).forEach(function(e){d[e.name]=true;});return d;}
function setWt(e){if(!e||!e.sets)return 0;return e.sets.reduce(function(a,s){var r=s.leftReps!==''?nv(s.leftReps)+nv(s.rightReps):nv(s.reps);return a+nv(s.weight)*r;},0);}
function last6(){
  var days={};S.log.forEach(function(e){if(!e.sets)return;var w=setWt(e);days[e.date]=(days[e.date]||0)+w;});
  return Object.keys(days).sort(function(a,b){return b.localeCompare(a);}).slice(0,6).map(function(d){return[d,days[d]];});
}
function todayTotal(){return S.log.filter(function(e){return e.date===today()&&e.sets;}).reduce(function(s,e){return s+setWt(e);},0);}
function lastEntry(name){return S.log.filter(function(e){return e.name===name;}).sort(function(a,b){return b.id-a.id;})[0]||null;}

function entryDetail(e){
  if(e.type==='cardio'){var p=[];if(e.incline)p.push('Incline '+e.incline+'%');if(e.speed)p.push('Speed '+e.speed+' mph');if(e.time)p.push(e.time+' min');return p.join(' &middot; ')||'&mdash;';}
  if(!e.sets)return'&mdash;';
  var lines=e.sets.map(function(s,i){var w=nv(s.weight);var lr=s.leftReps!==''?'L'+nv(s.leftReps)+' R'+nv(s.rightReps):null;var r=lr||(nv(s.reps)>0?nv(s.reps)+' reps':null);if(!w&&!r)return null;return'Set '+(i+1)+': '+(w?w+'lb':'&mdash;')+(r?' &times; '+r:'');}).filter(Boolean);
  return lines.join(' &nbsp;|&nbsp; ')||'&mdash;';
}

var IC={
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  check30:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  chevD:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  chevU:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>',
  db:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="6" width="3" height="12" rx="1.5"/><rect x="16.5" y="6" width="3" height="12" rx="1.5"/><rect x="7.5" y="9.5" width="9" height="5" rx="1"/><line x1="7.5" y1="12" x2="3" y2="12"/><line x1="16.5" y1="12" x2="21" y2="12"/></svg>',
  flame:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c0 6-6 8-6 13a6 6 0 0012 0c0-5-6-7-6-13z"/></svg>',
  user:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  chart:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
  gear:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  clock:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  plus:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>',
};

function numField(label,fkey,value,suffix,carried){
  var cs=carried?'<span style="color:#E5493D;text-transform:none;margin-left:6px;">&middot; carried over</span>':'';
  var pr=suffix?'padding-right:40px;':'';
  return'<label style="display:block;"><span class="eyebrow">'+label+cs+'</span>'+
    '<div style="position:relative;">'+
    '<input type="number" inputmode="decimal" class="ni'+(carried?' carried':'')+'" data-field="'+fkey+'" value="'+esc(String(value||''))+'" placeholder="0" style="'+pr+(carried?'color:#E5493D;border-color:#6B2E28;':'')+'"/>'+
    (suffix?'<span class="muted mono" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;">'+suffix+'</span>':'')+
    '</div></label>';
}


function workoutCalendar(){
  var logByDate={};
  S.log.forEach(function(e){if(!logByDate[e.date])logByDate[e.date]=[];logByDate[e.date].push(e);});
  var now=new Date();var todaySt=today();
  var dow=now.getDay();
  var start=new Date(now);start.setDate(start.getDate()-dow-21);
  var startStr=start.getFullYear()+'-'+pad(start.getMonth()+1)+'-'+pad(start.getDate());
  var dayLabels=['S','M','T','W','T','F','S'].map(function(d){
    return'<span style="text-align:center;font-size:10px;color:#555048;display:block;font-weight:600;">'+d+'</span>';}).join('');
  var blocks='';
  for(var i=0;i<28;i++){
    var d=new Date(start);d.setDate(d.getDate()+i);
    var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var isToday=ds===todaySt;var isFuture=ds>todaySt;
    var entries=logByDate[ds]||[];var cnt=entries.length;
    var bg,ring;
    if(isFuture){bg='#1C1B1A';ring='opacity:0.2;';}
    else if(cnt===0){bg=isToday?'#2E2C28':'#242220';ring=isToday?'outline:2px solid #D9A441;outline-offset:-2px;':'';
    }else{
      bg=cnt<=2?'#1F4A38':cnt<=5?'#2D6B52':'#3D8C6A';
      ring=isToday?'outline:2px solid #7AC4A8;outline-offset:-2px;':'';
    }
    var tip=fmtDate(ds)+(cnt?' ('+cnt+' '+(cnt===1?'activity':'activities')+')':'');
    blocks+='<div title="'+tip+'" style="aspect-ratio:1/1;background:'+bg+';border-radius:3px;'+ring+'"></div>';
  }
  var streak=0,chk=new Date(now);
  for(var si=0;si<365;si++){
    var ds2=chk.getFullYear()+'-'+pad(chk.getMonth()+1)+'-'+pad(chk.getDate());
    if(logByDate[ds2]&&logByDate[ds2].length){streak++;chk.setDate(chk.getDate()-1);}
    else if(ds2===todaySt){chk.setDate(chk.getDate()-1);}
    else break;
  }
  var sessions=0;
  for(var k in logByDate){if(k>=startStr)sessions++;}
  var streakTxt=streak>0?'\u{1F525} '+streak+' day streak':'No active streak';
  return'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;">'+dayLabels+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">'+blocks+'</div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:10px;">'+
      '<span style="font-size:12px;color:#8A8478;">'+streakTxt+'</span>'+
      '<span style="font-size:12px;color:#8A8478;">'+sessions+' sessions / 4 wks</span>'+
    '</div>';
}

function render(){
  var r=document.getElementById('root');
  if(S.screen==='home')         r.innerHTML=renderHome();
  else if(S.screen==='list')     r.innerHTML=renderList();
  else if(S.screen==='activity') r.innerHTML=renderActivity();
  else if(S.screen==='manage')   r.innerHTML=renderManage();
  else if(S.screen==='graph')    r.innerHTML=renderGraph();
  else if(S.screen==='history')  r.innerHTML=renderHistory();
}

function renderHome(){
  var p=S.profile;var b=bmi(nv(p.heightIn),nv(p.weightLb));
  var done=doneNames();var dc=Object.keys(done).length;var ord=buildOrder();
  var bmiHtml='';
  if(b){bmiHtml='<div class="divtop" style="display:flex;align-items:center;justify-content:space-between;">'+
    '<div><span class="eyebrow">BMI</span><div class="mono" style="font-size:24px;color:#F2EFE9;">'+b.toFixed(1)+'</div></div>'+
    '<span class="tag">'+bmiLbl(b)+'</span></div>';}
  var l6Html=workoutCalendar();
  var wBtn=dc>0
    ?'<div class="resume-bar"><div><div class="eyebrow" style="margin-bottom:2px;">Today\'s Progress</div>'+
      '<div style="font-size:14px;font-weight:600;color:#F2EFE9;">'+dc+' of '+ord.length+' done</div></div>'+
      '<button class="btn" data-action="start" style="width:auto;padding:10px 16px;font-size:13px;">Resume '+IC.chev+'</button></div>'
    :'<button class="btn" data-action="start" style="margin-bottom:12px;">Start Today\'s Workout '+IC.chev+'</button>';
  return'<div class="page">'+
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span class="accent">'+IC.db+'</span>'+
    '<h1 class="display" style="font-size:24px;color:#F2EFE9;">Iron Log</h1></div>'+
    '<p class="muted" style="font-size:14px;margin-bottom:24px;">Your workout, tracked set by set.</p>'+

/* shared SVG line chart */
function makeLineSVG(data,key,color){
  var W=300,H=150,ml=42,mr=8,mt=14,mb=26,gW=W-ml-mr,gH=H-mt-mb,n=data.length;
  var vals=data.map(function(d){return d[key];});
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),rng=hi-lo||1;
  var pd=rng*0.18+0.5,yMn=lo-pd,yMx=hi+pd;
  function xp(i){return ml+(n>1?i/(n-1):0.5)*gW;}
  function yp(v){return mt+gH-((v-yMn)/(yMx-yMn))*gH;}
  var grid='';
  for(var gi=0;gi<=4;gi++){var gy=mt+(gi/4)*gH,gv=yMx-(gi/4)*(yMx-yMn);
    grid+='<line x1="'+ml+'" y1="'+gy.toFixed(1)+'" x2="'+(W-mr)+'" y2="'+gy.toFixed(1)+'" stroke="#2A2825" stroke-width="1"/>';
    grid+='<text x="'+(ml-4)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#6E695E">'+Math.round(gv)+'</text>';}
  var pts=data.map(function(d,i){return xp(i).toFixed(1)+','+yp(d[key]).toFixed(1);}).join(' ');
  var area=ml.toFixed(1)+','+(mt+gH)+' '+pts+' '+xp(n-1).toFixed(1)+','+(mt+gH);
  var dots=data.map(function(d,i){return'<circle cx="'+xp(i).toFixed(1)+'" cy="'+yp(d[key]).toFixed(1)+'" r="2.5" fill="'+color+'"/>';}).join('');
  var lblIdx=[0];if(n>2)lblIdx.push(Math.floor(n/2));lblIdx.push(n-1);
  lblIdx=lblIdx.filter(function(v,i,a){return a.indexOf(v)===i;});
  var xlbls=lblIdx.map(function(i){var anch=i===0?'start':i===n-1?'end':'middle';
    return'<text x="'+xp(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="'+anch+'" font-size="8.5" fill="#6E695E">'+fmtDate(data[i].date)+'</text>';}).join('');
  var lv=data[n-1][key],lx=xp(n-1),ly=yp(lv);
  var lbl='<text x="'+(lx-5).toFixed(1)+'" y="'+(ly-8).toFixed(1)+'" text-anchor="end" font-size="10" fill="'+color+'" font-weight="bold">'+lv+'</text>';
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;">'+
    grid+'<polyline points="'+area+'" fill="'+color+'1a" stroke="none"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+lbl+xlbls+'</svg>';
}

/* volume bar chart for history */
function makeBarSVG(data){
  var W=300,H=110,ml=8,mr=8,mt=14,mb=24,gW=W-ml-mr,gH=H-mt-mb,n=data.length;
  if(!n)return'';
  var vals=data.map(function(d){return d.v;});
  var mx=Math.max.apply(null,vals)||1;
  var bw=Math.max(4,Math.floor(gW/n)-3);
  var bars=data.map(function(d,i){
    var x=ml+i*(gW/n)+(gW/n-bw)/2;
    var bh=Math.max(2,(d.v/mx)*gH);
    var y=mt+gH-bh;
    var isT=d.date===today();
    return'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+(isT?'#D9A441':'#4A8C7C')+'"/>'+
      (i===n-1||i===0?'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#6E695E">'+fmtDate(d.date)+'</text>':'');
  }).join('');
  var topLbl='<text x="'+(ml+(n-1)*(gW/n)+bw/2+2).toFixed(1)+'" y="'+(mt+gH-((vals[n-1]/mx)*gH)-4).toFixed(1)+'" font-size="9" fill="#D9A441" font-weight="bold">'+Math.round(vals[n-1]/1000)+'k</text>';
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;">'+bars+(vals[n-1]>0?topLbl:'')+'</svg>';
}

function renderHistory(){
  var days={};
  S.log.forEach(function(e){if(!days[e.date])days[e.date]=[];days[e.date].push(e);});
  var byDay=Object.keys(days).sort(function(a,b){return b.localeCompare(a);}).map(function(d){return[d,days[d]];});

  /* build volume chart data — last 12 workout days, oldest→newest */
  var volData=byDay.slice(0,12).reverse().map(function(pair){
    var v=pair[1].filter(function(e){return e.sets;}).reduce(function(s,e){return s+setWt(e);},0);
    return{date:pair[0],v:v};
  });
  var volChart='';
  if(volData.length>1){
    volChart='<div class="surf" style="padding:16px;margin-bottom:16px;">'+
      '<span class="eyebrow">Volume per Session (lb lifted)</span>'+
      makeBarSVG(volData)+
      '<p style="font-size:11px;color:#6E695E;margin-top:6px;text-align:center;">Gold bar = today\'s session</p>'+
    '</div>';
  }

  if(!byDay.length){
    return'<div class="page"><button class="back" data-action="home" style="margin-bottom:24px;">'+IC.back+' Home</button>'+
      '<h2 class="display" style="font-size:20px;color:#F2EFE9;margin-bottom:20px;">History</h2>'+
      '<div class="surf" style="padding:24px;text-align:center;"><p class="muted" style="font-size:14px;">No workouts logged yet.</p></div></div>';
  }

  var t=today();
  var list=byDay.map(function(pair){
    var date=pair[0],entries=pair[1];var isOpen=!!S.expanded[date];var isToday=date===t;
    var dayWt=entries.filter(function(e){return e.sets;}).reduce(function(s,e){return s+setWt(e);},0);
    var todayBadge=isToday?'<span style="font-size:10px;color:#D9A441;border:1px solid #D9A441;border-radius:9999px;padding:2px 6px;letter-spacing:.06em;text-transform:uppercase;">Today</span>':'';
    var detail='';
    if(isOpen){detail='<div style="border-top:1px solid #2E2C28;">'+entries.map(function(e){
      var rTag=e.rating?'<span style="font-size:10px;color:'+RATING_COLOR[e.rating]+';border:1px solid '+RATING_COLOR[e.rating]+';border-radius:9999px;padding:1px 6px;white-space:nowrap;">'+RATING_LABEL[e.rating]+'</span>':'';
      return'<div class="act-row">'+
        '<span class="dot" style="width:9px;height:9px;background:'+CAT_COLOR[e.cat]+';margin-top:3px;flex-shrink:0;"></span>'+
        '<div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
          '<span style="font-size:14px;font-weight:600;color:#F2EFE9;">'+esc(e.name)+'</span>'+rTag+'</div>'+
          '<div style="font-size:12px;margin-top:3px;color:#8A8478;line-height:1.5;">'+entryDetail(e)+'</div></div>'+
        '<button class="btn-del" data-action="del-entry" data-id="'+e.id+'">'+IC.trash+'</button></div>';
    }).join('')+'</div>';}
    return'<div class="surf" style="overflow:hidden;margin-bottom:10px;">'+
      '<button class="day-hdr" data-action="toggle-day" data-date="'+date+'">'+
        '<div style="text-align:left;"><div style="display:flex;align-items:center;gap:8px;">'+
          '<span style="font-size:15px;font-weight:600;color:#F2EFE9;">'+(isToday?'Today':fmtDate(date))+'</span>'+todayBadge+'</div>'+
          '<div style="font-size:12px;margin-top:2px;color:#8A8478;">'+entries.length+' '+(entries.length===1?'activity':'activities')+(dayWt>0?' &middot; '+Math.round(dayWt).toLocaleString()+' lb':'')+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:10px;">'+
          '<span data-action="del-day" data-date="'+date+'" style="color:#6B2E28;cursor:pointer;display:flex;align-items:center;padding:4px;">'+IC.trash+'</span>'+
          '<span class="muted">'+(isOpen?IC.chevU:IC.chevD)+'</span></div></button>'+
      detail+'</div>';
  }).join('');

  return'<div class="page"><button class="back" data-action="home" style="margin-bottom:18px;">'+IC.back+' Home</button>'+
    '<h2 class="display" style="font-size:20px;color:#F2EFE9;margin-bottom:4px;">History</h2>'+
    '<p class="muted" style="font-size:14px;margin-bottom:16px;">'+byDay.length+' workout '+(byDay.length===1?'day':'days')+' logged.</p>'+
    volChart+list+'</div>';
}

/* EVENTS */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;
  var act=el.dataset.action;
  if(act==='start'){S.screen='list';S.act=null;render();}
  else if(act==='home'){S.screen='home';S.act=null;render();}
  else if(act==='list'){S.screen='list';S.act=null;render();}
  else if(act==='graph'){S.screen='graph';render();}
  else if(act==='manage'){S.screen='manage';render();}
  else if(act==='history'){S.screen='history';render();}
  else if(act==='gr'){S.graphRange=el.dataset.range;render();}
  else if(act==='toggle-day'){var d=el.dataset.date;S.expanded[d]=!S.expanded[d];render();}
  else if(act==='del-day'){
    e.stopPropagation();var d=el.dataset.date;var isT=d===today();
    if(confirm('Delete all activities on '+(isT?'today':fmtDate(d))+'?')){S.log=S.log.filter(function(en){return en.date!==d;});saveLog();render();}
  }
  else if(act==='del-entry'){
    e.stopPropagation();var id=parseInt(el.dataset.id);
    if(confirm('Delete this activity entry?')){S.log=S.log.filter(function(en){return en.id!==id;});saveLog();render();}
  }
  else if(act==='pick'){
    var name=el.dataset.name;var a=null;
    for(var i=0;i<S.acts.length;i++){if(S.acts[i].name===name){a=S.acts[i];break;}}
    if(!a)return;S.act=a;
    var last=lastEntry(name);var entry=blankEntry();
    if(a.type==='cardio'){entry.incline=last&&last.incline!=null?String(last.incline):'';entry.speed=last&&last.speed!=null?String(last.speed):'';entry.incCarried=entry.incline!=='';entry.spdCarried=entry.speed!=='';}
    else{for(var j=0;j<3;j++){var w=last&&last.sets&&last.sets[j]?String(last.sets[j].weight||''):'';entry.sets[j].weight=w;entry.sets[j].carried=w!=='';}}
    S.entry=entry;S.screen='activity';render();
  }
  else if(act==='rate'){var r=el.dataset.rating;S.entry.rating=S.entry.rating===r?null:r;render();}
  else if(act==='save'){
    var a2=S.act,en=S.entry;
    var rec={id:Date.now(),date:today(),name:a2.name,cat:a2.cat,type:a2.type,rating:en.rating};
    if(a2.type==='cardio'){rec.incline=en.incline;rec.speed=en.speed;rec.time=en.time;}
    else{rec.sets=en.sets.map(function(s){return{weight:s.weight,reps:s.reps,leftReps:s.leftReps,rightReps:s.rightReps};});}
    S.log.push(rec);saveLog();S.act=null;S.screen='list';render();
  }
  else if(act==='add-act'){
    var nm=(S._addName||'').trim();
    if(!nm){alert('Please enter an activity name.');return;}
    if(S.acts.some(function(a){return a.name.toLowerCase()===nm.toLowerCase();})){alert('Activity already exists.');return;}
    S.acts.push({name:nm,cat:S._addCat||'Arm & Shoulder',type:S._addType||'strength'});S._addName='';saveActs();render();
  }
  else if(act==='del-act'){var dn=el.dataset.name;if(confirm('Delete "'+dn+'"?')){S.acts=S.acts.filter(function(a){return a.name!==dn;});saveActs();render();}}
});

document.addEventListener('input',function(e){
  var f=e.target.dataset.field;if(!f)return;var v=e.target.value;
  if(f==='name'||f==='heightIn'||f==='weightLb'){
    S.profile[f]=v;saveProfile();
    if(f==='weightLb'&&nv(v))logWeight(v);
    if(f==='heightIn'||f==='weightLb'){
      var b=bmi(nv(S.profile.heightIn),nv(S.profile.weightLb));
      var slot=document.getElementById('bmi-slot');
      if(slot){if(!b)slot.innerHTML='';else slot.innerHTML='<div class="divtop" style="display:flex;align-items:center;justify-content:space-between;"><div><span class="eyebrow">BMI</span><div class="mono" style="font-size:24px;color:#F2EFE9;">'+b.toFixed(1)+'</div></div><span class="tag">'+bmiLbl(b)+'</span></div>';}
    }return;
  }
  if(f==='add-name'){S._addName=v;return;}
  if(f==='add-cat'){S._addCat=v;return;}
  if(f==='add-type'){S._addType=v;return;}
  if(!S.entry)return;
  if(f==='incline'){S.entry.incline=v;if(S.entry.incCarried&&!S.entry.incTouched){S.entry.incTouched=true;cc(e.target);}return;}
  if(f==='speed'){S.entry.speed=v;if(S.entry.spdCarried&&!S.entry.spdTouched){S.entry.spdTouched=true;cc(e.target);}return;}
  if(f==='time'){S.entry.time=v;return;}
  var m=f.match(/^set-(\d+)-(weight|reps|leftReps|rightReps)$/);
  if(m){var idx=parseInt(m[1]),sub=m[2];S.entry.sets[idx][sub]=v;
    if(sub==='weight'&&S.entry.sets[idx].carried&&!S.entry.sets[idx].touched){S.entry.sets[idx].touched=true;cc(e.target);}}
});

document.addEventListener('change',function(e){
  var f=e.target.dataset.field;if(!f)return;
  if(f==='add-cat')S._addCat=e.target.value;
  else if(f==='add-type')S._addType=e.target.value;
});

function cc(el){el.classList.remove('carried');el.style.color='#F2EFE9';el.style.borderColor='#3A362F';}

S._addCat='Arm & Shoulder';S._addType='strength';S._addName='';
load();render();
</script>
</body>
</html>
