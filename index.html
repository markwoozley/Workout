<script>
(function(){
  var c=document.createElement('canvas');
  c.width=c.height=512;
  var g=c.getContext('2d');
  var S=512,cx=256,cy=248;

  /* background */
  g.fillStyle='#1A1918';
  g.fillRect(0,0,S,S);

  /* pointy-top hexagon */
  function hexPath(r,ox,oy){
    g.beginPath();
    for(var i=0;i<6;i++){
      var a=Math.PI*(60*i-90)/180;
      if(i===0)g.moveTo(ox+r*Math.cos(a),oy+r*Math.sin(a));
      else g.lineTo(ox+r*Math.cos(a),oy+r*Math.sin(a));
    }
    g.closePath();
  }

  /* outer dark ring */
  hexPath(206,cx,cy);g.strokeStyle='#5A3E00';g.lineWidth=22;g.stroke();
  /* mid gold */
  hexPath(200,cx,cy);g.strokeStyle='#C4922A';g.lineWidth=16;g.stroke();
  /* inner bright highlight */
  hexPath(192,cx,cy);g.strokeStyle='#F0CC60';g.lineWidth=5;g.stroke();

  /* gold gradient helper */
  function gGrad(y,h){
    var gr=g.createLinearGradient(0,y-h*0.5,0,y+h*0.5);
    gr.addColorStop(0,'#F8E080');
    gr.addColorStop(0.25,'#D9A83C');
    gr.addColorStop(0.6,'#C09030');
    gr.addColorStop(1,'#8B5E10');
    return gr;
  }

  /* THE */
  var ty=cy-115;
  g.font='700 80px Arial';
  g.textAlign='center';g.textBaseline='middle';
  g.fillStyle=gGrad(ty,80);
  g.fillText('THE',cx,ty);

  /* GYM */
  var gy=cy+5;
  g.font='900 155px Arial';
  g.fillStyle=gGrad(gy,155);
  g.fillText('GYM',cx,gy);

  /* barbell */
  var by=cy+138,bw=236,bh=10;
  var pw=20,ph=58,sw=14,sh=42;

  function goldRect(x,y,w,h){
    var gr=g.createLinearGradient(0,y,0,y+h);
    gr.addColorStop(0,'#ECC050');gr.addColorStop(0.5,'#C49030');gr.addColorStop(1,'#8A5E10');
    g.fillStyle=gr;g.fillRect(x,y,w,h);
  }

  /* bar */
  goldRect(cx-bw/2,by-bh/2,bw,bh);

  /* left plates */
  goldRect(cx-bw/2,          by-sh/2, sw, sh);
  goldRect(cx-bw/2+sw+3,     by-ph/2, pw, ph);
  /* right plates */
  goldRect(cx+bw/2-sw-pw-3,  by-ph/2, pw, ph);
  goldRect(cx+bw/2-sw,       by-sh/2, sw, sh);

  /* hash lines on plates */
  g.strokeStyle='rgba(0,0,0,0.35)';g.lineWidth=3;
  function hash(x,w,yc,h){
    for(var i=1;i<4;i++){var y=yc-h/2+h*i/4;g.beginPath();g.moveTo(x+1,y);g.lineTo(x+w-1,y);g.stroke();}
  }
  hash(cx-bw/2,sw,by,sh); hash(cx-bw/2+sw+3,pw,by,ph);
  hash(cx+bw/2-sw-pw-3,pw,by,ph); hash(cx+bw/2-sw,sw,by,sh);

  /* set icon */
  var lnk=document.createElement('link');
  lnk.rel='apple-touch-icon';
  lnk.href=c.toDataURL('image/png');
  document.head.appendChild(lnk);
})();
</script>

function blankEntry(){return{incline:'',speed:'',time:'',calories:'',rating:null,note:'',incCarried:false,spdCarried:false,incTouched:false,spdTouched:false,sets:[0,1,2].map(function(){return{weight:'',reps:'',leftReps:'',rightReps:'',carried:false,touched:false,repsCarried:false,repsTouched:false};})}}

function logWeight(w){
  var wv=nv(w);if(!wv)return;var t=today();var idx=-1;
  for(var i=0;i<S.weightLog.length;i++){if(S.weightLog[i].date===t){idx=i;break;}}

function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function cvtMeas(val,unit){var v=nv(val);if(!v)return'';return unit==='in'?(v*2.54).toFixed(1)+' cm':(v/2.54).toFixed(1)+' in';}
function cvtWt(val,unit){var v=nv(val);if(!v)return'';return unit==='lb'?(v*0.4536).toFixed(1)+' kg':(v/0.4536).toFixed(1)+' lb';}
function addDays(ds,n){var p=ds.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function fmtFull(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function nv(v){var f=parseFloat(v);return isFinite(f)?f:0;}
function bmi(h,w){return(!h||!w)?null:703*w/(h*h);}
function bmiLbl(v){return v<18.5?'Underweight':v<25?'Normal':v<30?'Overweight':'Obese';}
function buildWHR(p){
  var w=nv(p.waist),h=nv(p.hip);
  if(!w||!h)return null;
  var r=(w/h).toFixed(2);var rv=parseFloat(r);
  var color;
  if(rv<0.80){color='#7AC4A8';}
  else if(rv<0.90){color='#D9A441';}
  else{color='#E5493D';}
  return{ratio:r,color:color};
}
function buildAHR(p){
  var a=nv(p.abdomen),h=nv(p.hip);
  if(!a||!h)return null;
  var r=(a/h).toFixed(2);var rv=parseFloat(r);
  var color;
  if(rv<0.90){color='#7AC4A8';}
  else if(rv<1.00){color='#D9A441';}
  else{color='#E5493D';}
  return{ratio:r,color:color};
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function buildOrder(){
  var acts=S.acts,cats=['Arm & Shoulder','Back','Leg','Core'],bc={};
  cats.forEach(function(c){bc[c]=acts.filter(function(a){return a.cat===c;}).sort(function(a,b){return a.name.localeCompare(b.name);});});
  var order=acts.filter(function(a){return a.cat==='Cardio';}).slice();var added=true;
  while(added){added=false;cats.forEach(function(c){if(bc[c]&&bc[c].length){order.push(bc[c].shift());added=true;}});}
  return order;
}
function doneNames(date){var t=date||today();var d={};S.log.filter(function(e){return e.date===t;}).forEach(function(e){d[e.name]=e;});return d;}
function setWt(e){if(!e||!e.sets)return 0;return e.sets.reduce(function(a,s){var r=s.leftReps!==''?nv(s.leftReps)+nv(s.rightReps):nv(s.reps);return a+nv(s.weight)*r;},0);}
function dayTotal(date){return S.log.filter(function(e){return e.date===date&&e.sets;}).reduce(function(s,e){return s+setWt(e);},0);}
function lastEntry(name){return S.log.filter(function(e){return e.name===name;}).sort(function(a,b){return b.id-a.id;})[0]||null;}
function entryDetail(e){
  if(e.type==='cardio'){var p=[];if(e.incline)p.push('Incline '+e.incline+'%');if(e.speed)p.push('Speed '+e.speed+' mph');if(e.time)p.push(e.time+' min');if(e.calories)p.push(e.calories+' cal');return p.join(' &middot; ')||'&mdash;';}

  var lines=e.sets.map(function(s,i){var w=nv(s.weight);var lr=s.leftReps!==''?'L'+nv(s.leftReps)+' R'+nv(s.rightReps):null;var r=lr||(nv(s.reps)>0?nv(s.reps)+' reps':null);if(!w&&!r)return null;return'Set '+(i+1)+': '+(w?w+'lb':'&mdash;')+(r?' &times; '+r:'');}).filter(Boolean);
  return lines.join(' &nbsp;|&nbsp; ')||'&mdash;';
}

function workoutCalendar(){
  var logByDate={};S.log.forEach(function(e){if(!logByDate[e.date])logByDate[e.date]=[];logByDate[e.date].push(e);});
  var now=new Date();var todaySt=today();var dow=now.getDay();
  var start=new Date(now);start.setDate(start.getDate()-dow-21);
  var startStr=start.getFullYear()+'-'+pad(start.getMonth()+1)+'-'+pad(start.getDate());
  var dayLabels=['S','M','T','W','T','F','S'].map(function(d){return'<span style="text-align:center;font-size:10px;color:#555048;display:block;font-weight:600;">'+d+'</span>';}).join('');
  var blocks='';
  for(var i=0;i<28;i++){
    var d=new Date(start);d.setDate(d.getDate()+i);
    var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var dayNum=d.getDate();var isToday=(ds===todaySt);var isFuture=(ds>todaySt);
    var entries=logByDate[ds]||[];var cnt=entries.length;
    var bg,ring,txtColor;
    if(isFuture){bg='#1C1B1A';ring='opacity:0.2;';txtColor='#3A3630';}
    else if(cnt===0){bg=isToday?'#2E2C28':'#242220';ring=isToday?'outline:2px solid #D9A441;outline-offset:-2px;':'';txtColor=isToday?'#D9A441':'#9A9088';}
    else{bg=cnt<=2?'#1F4A38':cnt<=5?'#2D6B52':'#3D8C6A';ring=isToday?'outline:2px solid #7AC4A8;outline-offset:-2px;':'';txtColor='#FFFFFF';}
    blocks+='<div title="'+esc(fmtDate(ds))+(cnt?' ('+cnt+' '+(cnt===1?'activity':'activities')+')'  :'')+
      '" style="aspect-ratio:1/1;background:'+bg+';border-radius:3px;'+ring+'display:flex;align-items:center;justify-content:center;">'+
      '<span style="font-size:9px;font-weight:700;color:'+txtColor+';line-height:1;">'+dayNum+'</span></div>';
  }
  var streak=0;var chk=new Date(now);
  for(var si=0;si<365;si++){var ds2=chk.getFullYear()+'-'+pad(chk.getMonth()+1)+'-'+pad(chk.getDate());if(logByDate[ds2]&&logByDate[ds2].length){streak++;chk.setDate(chk.getDate()-1);}else if(ds2===todaySt){chk.setDate(chk.getDate()-1);}else break;}
  var sessions=0;for(var k in logByDate){if(k>=startStr)sessions++;}
  return'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;">'+dayLabels+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">'+blocks+'</div>'+
    '<div style="display:flex;justify-content:space-between;margin-top:10px;">'+
      '<span style="font-size:12px;color:#8A8478;">'+(streak>0?'🔥 '+streak+' day streak':'No active streak')+'</span>'+
      '<span style="font-size:12px;color:#8A8478;">'+sessions+' sessions / 4 wks</span></div>';
}
function makeLineSVG(data,key,color){
  var W=300,H=150,ml=42,mr=8,mt=14,gW=W-ml-mr,gH=H-mt-26,n=data.length;
  var vals=data.map(function(d){return d[key];});var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),rng=hi-lo||1;
  var pd=rng*0.18+0.5,yMn=lo-pd,yMx=hi+pd;
  function xp(i){return ml+(n>1?i/(n-1):0.5)*gW;}function yp(v){return mt+gH-((v-yMn)/(yMx-yMn))*gH;}
  var grid='';for(var gi=0;gi<=4;gi++){var gy=mt+(gi/4)*gH,gv=yMx-(gi/4)*(yMx-yMn);grid+='<line x1="'+ml+'" y1="'+gy.toFixed(1)+'" x2="'+(W-mr)+'" y2="'+gy.toFixed(1)+'" stroke="#2A2825" stroke-width="1"/><text x="'+(ml-4)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#6E695E">'+Math.round(gv)+'</text>';}
  var pts=data.map(function(d,i){return xp(i).toFixed(1)+','+yp(d[key]).toFixed(1);}).join(' ');
  var area=ml.toFixed(1)+','+(mt+gH)+' '+pts+' '+xp(n-1).toFixed(1)+','+(mt+gH);
  var dots=data.map(function(d,i){return'<circle cx="'+xp(i).toFixed(1)+'" cy="'+yp(d[key]).toFixed(1)+'" r="2.5" fill="'+color+'"/>';}).join('');
  var lblIdx=[0];if(n>2)lblIdx.push(Math.floor(n/2));lblIdx.push(n-1);lblIdx=lblIdx.filter(function(v,i,a){return a.indexOf(v)===i;});
  var xlbls=lblIdx.map(function(i){var anch=i===0?'start':i===n-1?'end':'middle';return'<text x="'+xp(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="'+anch+'" font-size="8.5" fill="#6E695E">'+fmtDate(data[i].date)+'</text>';}).join('');
  var lv=data[n-1][key],lx=xp(n-1),ly=yp(lv);
  return'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;">'+grid+'<polyline points="'+area+'" fill="'+color+'1a" stroke="none"/><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'<text x="'+(lx-5).toFixed(1)+'" y="'+(ly-8).toFixed(1)+'" text-anchor="end" font-size="10" fill="'+color+'" font-weight="bold">'+lv+'</text>'+xlbls+'</svg>';
}

function renderGraph(){
  var rangeDays={week:7,month:30,'3m':90,'6m':180,year:365};
  var days=rangeDays[S.graphRange]||30;var cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);
  var cs=cutoff.getFullYear()+'-'+pad(cutoff.getMonth()+1)+'-'+pad(cutoff.getDate());
  var filtered=S.weightLog.filter(function(d){return d.date>=cs;});
  var filteredA=S.abdomenLog.filter(function(d){return d.date>=cs;});
  var filteredW=S.waistLog.filter(function(d){return d.date>=cs;});
  var filteredH=S.hipLog.filter(function(d){return d.date>=cs;});
  var rBtns=['week','month','3m','6m','year'].map(function(r){var lbl={week:'Week',month:'Month','3m':'3M','6m':'6M',year:'Year'}[r];return'<button class="rng-btn'+(S.graphRange===r?' on':'')+'" data-action="gr" data-range="'+r+'">'+lbl+'</button>';}).join('');
  var mu=S.profile.measUnit||'in';

  function noData(msg){return'<p class="muted" style="font-size:13px;text-align:center;padding:24px 0;">'+msg+'</p>';}
  function singleVal(v,u,d){return'<div style="text-align:center;padding:16px 0;"><div class="mono" style="font-size:34px;color:#F2EFE9;">'+v+'</div><div class="eyebrow" style="margin-top:4px;">'+u+' &middot; '+fmtDate(d)+'</div></div>';}
  function chartCard(color,label,data,key,unit){
    var c=data.length===0?noData('No data yet.'):data.length===1?singleVal(data[0][key],unit,data[0].date):makeLineSVG(data,key,color);

      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">'+

  /* body weight chart */
  var weightChart=filtered.length===0?noData('Update your weight on the home screen to track it.'):
    filtered.length===1?singleVal(filtered[0].weight,'lb',filtered[0].date):makeLineSVG(filtered,'weight','#D9A441');

  return'<div class="page"><button class="back" data-action="home" style="margin-bottom:18px;">'+IC.back+' Home</button>'+
    '<h2 class="display" style="font-size:20px;color:#F2EFE9;margin-bottom:4px;">Measurements</h2>'+
    '<p class="muted" style="font-size:14px;margin-bottom:14px;">Auto-logged when you update on the home screen.</p>'+
    '<div style="display:flex;gap:6px;margin-bottom:14px;">'+rBtns+'</div>'+
    '<div class="surf" style="padding:14px;margin-bottom:12px;">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">'+
        '<span style="width:9px;height:9px;border-radius:9999px;background:#D9A441;display:inline-block;"></span>'+
        '<span class="eyebrow" style="display:inline;margin:0;">Body Weight</span></div>'+weightChart+'</div>'+
    chartCard('#9B9284','Abdomen ('+mu+')',filteredA,'abdomen',mu)+
    chartCard('#5B8FA8','Waist ('+mu+')',filteredW,'waist',mu)+
    chartCard('#B2593F','Hip ('+mu+')',filteredH,'hip',mu)+
    '</div>';

function startReview(mode){
  S.reviewMode=mode;
  S.reviewResult='loading';
  render();
  var days2=mode==='checkin'?15:30;
  if(S.log.length<2){S.reviewResult='error';render();return;}
  var pct=0;var bar=setInterval(function(){
    pct=Math.min(pct+2,88);
    var el=document.getElementById('review-bar');
    if(el)el.style.width=pct+'%';
  },250);
  var days={};
  S.log.forEach(function(e){if(!days[e.date])days[e.date]=[];days[e.date].push(e);});
  var dayKeys=Object.keys(days).sort();
  var summary=dayKeys.slice(-days2).map(function(d){
    return d+': '+days[d].map(function(e){
      if(e.type==='cardio')return e.name+' (incline:'+e.incline+'% speed:'+e.speed+'mph time:'+e.time+'min)';
      if(!e.sets)return e.name;
      var setStr=e.sets.filter(function(s){return nv(s.weight)>0||nv(s.reps)>0;}).map(function(s){
        if(s.leftReps!==undefined&&s.leftReps!=='')return nv(s.weight)+'lb L'+nv(s.leftReps)+'/R'+nv(s.rightReps);
        return nv(s.weight)+'lb x'+nv(s.reps);
      }).join(', ');
      return e.name+(setStr?' ('+setStr+')':'')+(e.rating?' ['+e.rating+']':'');
    }).join('; ');
  }).join('\n');
  var p=S.profile;
  var hm=S.healthMetrics||{};
  var profileStr='Name:'+p.name+' Height:'+p.heightIn+'in Weight:'+p.weightLb+'lb'
    +(p.waist?' Waist:'+p.waist+(p.measUnit||'in'):'')
    +(p.hip?' Hip:'+p.hip+(p.measUnit||'in'):'');
  var hmStr='';
  if(hm.rhr)hmStr+=' Resting HR:'+hm.rhr+'bpm';
  if(hm.hrv)hmStr+=' HRV:'+hm.hrv+'ms';
  if(hm.sleep)hmStr+=' Avg sleep:'+hm.sleep+'hrs';
  if(hm.steps)hmStr+=' Daily steps:~'+hm.steps;
  var prompt=mode==='checkin'
    ?'You are a personal trainer doing a brief 15-day check-in for a gym client.\n\n'
      +'Client: '+profileStr+(hmStr?'\nHealth metrics:'+hmStr:'')+'\n\n'
      +'Last 15 days of workouts:\n'+summary+'\n\n'
      +'Give a short, energising check-in covering:\n'
      +'1. One thing going well this week\n'
      +'2. One thing to tweak or improve\n'
      +'3. Two specific focus points for the next 7 days\n\n'
      +'Keep it brief, direct and motivating. Use their actual exercise names and numbers.'
    :'You are a personal trainer doing a comprehensive monthly review for a gym client.\n\n'
      +'Client: '+profileStr+(hmStr?'\nHealth metrics:'+hmStr:'')+'\n\n'
      +'Last 30 days of workouts:\n'+summary+'\n\n'
      +'Provide a thorough review covering:\n'
      +'1. Strengths — what they are doing well\n'
      +'2. Muscle group balance — any gaps or neglected areas?\n'
      +'3. Progressive overload — are weights and reps improving over time?\n'
      +'4. Recovery — frequency, rest days, effort ratings\n'
      +(hmStr?'5. Health metrics — comment on their RHR, HRV, sleep and steps\n':'')
      +'6. Three specific, actionable recommendations for the next month\n\n'
      +'Be specific. Use their actual exercise names, weights and numbers. Keep it practical and motivating.';
  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:prompt}]})
  }).then(function(r){return r.json();})
  .then(function(data){
    clearInterval(bar);
    var el=document.getElementById('review-bar');if(el)el.style.width='100%';
    S.reviewResult=(data.content&&data.content[0]&&data.content[0].text)?data.content[0].text:'error';
    setTimeout(function(){render();},300);
  }).catch(function(){clearInterval(bar);S.reviewResult='error';render();});
}

function autoSave(){
  if(!S.act||!S.entry)return;
  var a=S.act,en=S.entry,saveDate=S.workoutDate||today();
  var rec={id:Date.now(),date:saveDate,name:a.name,cat:a.cat,type:a.type,rating:en.rating,note:en.note||'',complete:false};
  if(a.type==='cardio'){rec.incline=en.incline;rec.speed=en.speed;rec.time=en.time;rec.calories=en.calories||0;}
  else{rec.sets=en.sets.map(function(s){return{weight:s.weight,reps:s.reps,leftReps:s.leftReps,rightReps:s.rightReps};});}
  /* replace any existing entry for this activity today */
  S.log=S.log.filter(function(e){return!(e.name===a.name&&e.date===saveDate);});
  S.log.push(rec);saveLog();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;var act=el.dataset.action;
  if(act==='start-today'){S.screen='list';S.workoutDate=today();S.act=null;render();}
  else if(act==='home'){if(S.screen==='activity')autoSave();S.screen='home';S.act=null;render();}
  else if(act==='list'){if(S.screen==='activity')autoSave();S.screen='list';S.act=null;render();}
  else if(act==='graph'){S.screen='graph';render();}
  else if(act==='manage'){S.screen='manage';render();}
  else if(act==='gr'){S.graphRange=el.dataset.range;render();}
  else if(act==='review'){S.screen='review';S.reviewResult=null;S.reviewMode=null;render();}
  else if(act==='run-checkin'){startReview('checkin');}
  else if(act==='run-review'){startReview('full');}
  else if(act==='rate'){if(S.entry){var r=el.dataset.rating;S.entry.rating=(S.entry.rating===r?null:r);render();}}
  else if(act==='edit-rate'){if(S.editEntry){var r=el.dataset.rating;S.editEntry.rating=(S.editEntry.rating===r?null:r);render();}}
  else if(act==='toggle-meas-unit'){
    S.profile.measUnit=S.profile.measUnit==='in'?'cm':'in';
    saveProfile();render();
  }
  else if(act==='prev-day'){S.workoutDate=addDays(S.workoutDate||today(),-1);render();}
  else if(act==='next-day'){var nd=addDays(S.workoutDate||today(),1);if(nd<=today()){S.workoutDate=nd;render();}}
  else if(act==='pick'){
    var name=el.dataset.name;var a=null;
    for(var i=0;i<S.acts.length;i++){if(S.acts[i].name===name){a=S.acts[i];break;}}
    if(!a)return;S.act=a;
    var wd=S.workoutDate||today();
    /* check if this activity already has an entry TODAY (from auto-save) */
    var todayEntry=null;
    for(var ti=0;ti<S.log.length;ti++){if(S.log[ti].name===name&&S.log[ti].date===wd){todayEntry=S.log[ti];break;}}
    var last=todayEntry||lastEntry(name);
    var fromToday=!!todayEntry;
    var entry=blankEntry();
    if(a.type==='cardio'){
      entry.incline =last&&last.incline !=null?String(last.incline) :'';
      entry.speed   =last&&last.speed   !=null?String(last.speed)   :'';
      entry.time    =last&&last.time    !=null?String(last.time)    :'';
      entry.calories=last&&last.calories!=null?String(last.calories):'';
      /* only mark red if carried from a PREVIOUS session, not today */
      entry.incCarried=!fromToday&&entry.incline!=='';
      entry.spdCarried=!fromToday&&entry.speed!=='';
    }else{
      for(var j=0;j<3;j++){
        var w=last&&last.sets&&last.sets[j]?String(last.sets[j].weight||''):'';
        var r=last&&last.sets&&last.sets[j]?String(last.sets[j].reps||''):'';
        var lr=last&&last.sets&&last.sets[j]?String(last.sets[j].leftReps||''):'';
        var rr=last&&last.sets&&last.sets[j]?String(last.sets[j].rightReps||''):'';
        entry.sets[j].weight    =w;
        entry.sets[j].reps      =r;
        entry.sets[j].leftReps  =lr;
        entry.sets[j].rightReps =rr;
        entry.sets[j].carried     =!fromToday&&w!=='';
        entry.sets[j].repsCarried =!fromToday&&r!=='';
        entry.sets[j].repsTouched =false;
      }
    }
    if(last)entry.rating=last.rating;
    if(last&&last.note){entry.note=last.note;entry.noteCarried=!fromToday;}else{entry.note='';entry.noteCarried=false;}
    S.entry=entry;S.screen='activity';render();
  }
  else if(act==='save'){
    var a2=S.act;var en=S.entry;var saveDate=S.workoutDate||today();
    var rec={id:Date.now(),date:saveDate,name:a2.name,cat:a2.cat,type:a2.type,rating:en.rating,note:en.note||'',complete:true};
    if(a2.type==='cardio'){rec.incline=en.incline;rec.speed=en.speed;rec.time=en.time;rec.calories=en.calories||0;}
    else{rec.sets=en.sets.map(function(s){return{weight:s.weight,reps:s.reps,leftReps:s.leftReps,rightReps:s.rightReps};});}
    /* replace any existing entry for this activity today rather than duplicating */
    S.log=S.log.filter(function(e){return!(e.name===a2.name&&e.date===saveDate);});
    S.log.push(rec);saveLog();S.act=null;S.screen='list';render();
  }
  else if(act==='add-act'){var nm=(S._addName||'').trim();if(!nm){alert('Please enter a name.');return;}if(S.acts.some(function(a){return a.name.toLowerCase()===nm.toLowerCase();})){alert('Already exists.');return;}S.acts.push({name:nm,cat:S._addCat||'Arm & Shoulder',type:S._addType||'strength'});S._addName='';saveActs();render();}
  else if(act==='edit-act'){S.editingAct=el.dataset.name;S._editActName=el.dataset.name;S._editActCat=null;S._editActType=null;render();}
  else if(act==='cancel-act-edit'){S.editingAct=null;render();}
  else if(act==='save-act-edit'){
    var oldName=S.editingAct;
    var newName=(S._editActName||'').trim();
    if(!newName){alert('Name cannot be empty.');return;}
    var idx=-1;for(var i=0;i<S.acts.length;i++){if(S.acts[i].name===oldName){idx=i;break;}}
    if(idx<0)return;
    var newCat=S._editActCat||S.acts[idx].cat;
    var newType=S._editActType||S.acts[idx].type;
    /* check for duplicate name (ignoring self) */
    if(newName!==oldName&&S.acts.some(function(a){return a.name.toLowerCase()===newName.toLowerCase();})){alert('An activity with that name already exists.');return;}
    S.acts[idx]={name:newName,cat:newCat,type:newType};
    /* update any log entries with the old name */
    if(newName!==oldName){S.log.forEach(function(e){if(e.name===oldName)e.name=newName;});saveLog();}
    saveActs();S.editingAct=null;render();
  }
  else if(act==='del-act'){var dn=el.dataset.name;if(confirm('Delete "'+dn+'"?')){S.acts=S.acts.filter(function(a){return a.name!==dn;});saveActs();render();}}
  else if(act==='restore-data'){
    var ta=document.getElementById('backup-ta');
    if(!ta)return;
    try{
      var d=JSON.parse(ta.value);
      if(!d.log||!Array.isArray(d.log)){alert('Invalid backup data.');return;}
      if(!confirm('This will replace ALL current data with the backup. Continue?'))return;
      if(d.log)        {S.log=d.log;        saveLog();}
      if(d.weightLog)  {S.weightLog=d.weightLog;try{localStorage.setItem('il_wl',JSON.stringify(S.weightLog));}catch(e){}}
      if(d.notes)      {S.notes=d.notes;    saveNotes();}
      if(d.profile)    {S.profile=d.profile;saveProfile();}
      if(d.acts)       {S.acts=d.acts;      saveActs();}
      if(d.unit)       {S.unit=d.unit;      try{localStorage.setItem('il_unit',d.unit);}catch(e){}}
      alert('Data restored! '+d.log.length+' workout entries loaded.');
      S.screen='home';render();
    }catch(ex){alert('Could not read backup — make sure you copied the full text.');}
  }
});
document.addEventListener('input',function(e){
  var f=e.target.dataset.field;if(!f)return;var v=e.target.value;
  if(f==='name'||f==='heightIn'||f==='weightLb'||f==='abdomen'||f==='waist'||f==='hip'){
    S.profile[f]=v;saveProfile();
    if(f==='weightLb'&&nv(v))logWeight(v);
    if(f==='abdomen'&&nv(v))logAbdomen(v);
    if(f==='waist'&&nv(v))logWaist(v);
    if(f==='hip'&&nv(v))logHip(v);
    if(f==='heightIn'||f==='weightLb'){var b=bmi(nv(S.profile.heightIn),nv(S.profile.weightLb));var slot=document.getElementById('bmi-slot');if(slot){if(!b){slot.innerHTML='';}else{var whr2=buildWHR(S.profile);var ahr2=buildAHR(S.profile);slot.innerHTML='<div class="divtop" style="display:flex;align-items:center;justify-content:space-between;"><div><span class="eyebrow">BMI</span><div class="mono" style="font-size:24px;color:#F2EFE9;">'+b.toFixed(1)+'</div></div><span class="tag">'+bmiLbl(b)+'</span></div>'+ratioRow('Waist-to-Hip',whr2);}}}return;
  }
  if(f==='add-name'){S._addName=v;return;}
  if(f==='add-cat'){S._addCat=v;return;}
  if(f==='add-type'){S._addType=v;return;}
  if(f==='edit-act-name'){S._editActName=v;return;}
  if(f==='edit-act-cat'){S._editActCat=v;return;}
  if(f==='edit-act-type'){S._editActType=v;return;}
  if(f==='day-note'){S.notes[S.workoutDate||today()]=v;saveNotes();return;}
  if(f==='act-note'){if(S.entry){S.entry.note=v;S.entry.noteCarried=false;}return;}
  if(f==='hm-rhr'||f==='hm-hrv'||f==='hm-sleep'||f==='hm-steps'){
    if(!S.healthMetrics)S.healthMetrics={};
    S.healthMetrics[f.slice(3)]=v;return;
  }
  if(!S.entry)return;
  if(f==='incline'){S.entry.incline=v;if(S.entry.incCarried&&!S.entry.incTouched){S.entry.incTouched=true;cc(e.target);}return;}
  if(f==='speed'){S.entry.speed=v;if(S.entry.spdCarried&&!S.entry.spdTouched){S.entry.spdTouched=true;cc(e.target);}return;}
  if(f==='time'){S.entry.time=v;return;}
  if(f==='calories'){if(S.entry)S.entry.calories=v;return;}
  var m=f.match(/^set-(\d+)-(weight|reps|leftReps|rightReps)$/);
  if(m){var idx=parseInt(m[1]);var sub=m[2];S.entry.sets[idx][sub]=v;
    if(sub==='weight'&&S.entry.sets[idx].carried&&!S.entry.sets[idx].touched){
      S.entry.sets[idx].touched=true;cc(e.target);
    }
    /* typing reps confirms carried weight */
    if((sub==='reps'||sub==='leftReps'||sub==='rightReps')&&S.entry.sets[idx].carried&&!S.entry.sets[idx].touched){
      S.entry.sets[idx].touched=true;
      var wInput=document.querySelector('[data-field="set-'+idx+'-weight"]');
      if(wInput)cc(wInput);
    }
    /* typing reps clears the reps carried flag */
    if((sub==='reps'||sub==='leftReps'||sub==='rightReps')&&S.entry.sets[idx].repsCarried&&!S.entry.sets[idx].repsTouched){
      S.entry.sets[idx].repsTouched=true;cc(e.target);
    }
  }
});
document.addEventListener('change',function(e){var f=e.target.dataset.field;if(!f)return;
  if(f==='add-cat')S._addCat=e.target.value;
  else if(f==='add-type')S._addType=e.target.value;
  else if(f==='edit-act-cat')S._editActCat=e.target.value;
  else if(f==='edit-act-type')S._editActType=e.target.value;
});
function cc(el){el.classList.remove('carried');el.style.color='#F2EFE9';el.style.borderColor='#3A362F';}
/* ── UNIT PICKER (long-press on any weight suffix) ── */
var _lpt=null;
function removeUnitPopup(){var p=document.getElementById('unit-pop');if(p)p.remove();}
function showUnitPicker(target){
  removeUnitPopup();
  var pop=document.createElement('div');
  pop.id='unit-pop';
  pop.style.cssText='position:fixed;background:#211F1B;border:1px solid #D9A441;border-radius:10px;padding:6px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.6);min-width:180px;';
  var rect=target.getBoundingClientRect();
  var top=rect.bottom+8;
  if(top+120>window.innerHeight)top=rect.top-120;
  pop.style.top=top+'px';
  pop.style.left=Math.max(12,Math.min(rect.left-40,window.innerWidth-196))+'px';
  var title=document.createElement('div');
  title.style.cssText='font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A8478;padding:4px 10px 8px;';
  title.textContent='Weight Unit';pop.appendChild(title);
  ['lb','kg'].forEach(function(u){
    var btn=document.createElement('button');
    var active=S.unit===u;
    btn.style.cssText='display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:'+(active?'#2D2A1A':'transparent')+';border:none;border-radius:6px;color:'+(active?'#D9A441':'#F2EFE9')+';font-size:15px;cursor:pointer;font-family:inherit;text-align:left;';
    btn.innerHTML='<span style="font-size:18px;font-family:\'Courier New\',Courier,monospace;font-weight:700;min-width:28px;">'+u+'</span>'+
      '<span>'+(u==='lb'?'Pounds':'Kilograms')+'</span>'+
      (active?'<span style="margin-left:auto;color:#D9A441;font-size:16px;">&#10003;</span>':'');
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      S.unit=u;
      try{localStorage.setItem('il_unit',u);}catch(ex){}
      removeUnitPopup();render();
    });
    pop.appendChild(btn);
  });
  document.body.appendChild(pop);
  setTimeout(function(){
    function outside(e){if(!pop.contains(e.target)){removeUnitPopup();document.removeEventListener('click',outside);}}
    document.addEventListener('click',outside);
  },50);
}
document.addEventListener('touchstart',function(e){
  var el=e.target.closest('[data-unit-sfx="1"]');if(!el)return;
  e.preventDefault();
  _lpt=setTimeout(function(){showUnitPicker(el);},500);
},{passive:false});
document.addEventListener('touchend',function(){clearTimeout(_lpt);});
document.addEventListener('touchmove',function(){clearTimeout(_lpt);},{passive:true});
/* also allow click on desktop / iPad for testing */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-unit-sfx="1"]');if(!el)return;
  if(window._unitClickOK)showUnitPicker(el);
});
document.addEventListener('touchend',function(e){
  var el=e.target.closest('[data-unit-sfx="1"]');
  if(el){window._unitClickOK=true;setTimeout(function(){window._unitClickOK=false;},200);}
});

S._addCat='Arm & Shoulder';S._addType='strength';S._addName='';
load();S.workoutDate=today();render();
</script>
